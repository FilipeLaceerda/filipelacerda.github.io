<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Contato</title>
</head>
<body data-contexto="dark">
<header>
    <nav>
        <a href="index.html">Home</a>
        <button class="button-dark-mode">
            <img src="assets/dark_mode.svg" alt="Dark mode">
        </button>
    </nav>
</header>
<main>
    <h1 class="title-cadastro">Cadastro</h1>
    <form>
        <section>
            <label for="fnome">Nome</label>
            <input type="text" id="fnome" name="nome" placeholder="Digite seu nome" required>
        </section>
        <section>
            <label for="femail">Email</label>
            <input type="email" id="femail" name="email" placeholder="Digite seu email" required>
        </section>
        <section>
            <label for="ftelefone">Telefone</label>
            <input type="tel" id="ftelefone" name="telefone" placeholder="Digite seu telefone" required>
        </section>
        <section>
            <label for="fpassword">Senha</label>
            <input type="password" id="fpassword" name="senha" placeholder="Digite sua senha" required>
        </section>
        <section>
            <label for="fdata">Data de Nascimento</label>
            <input type="date" id="fdata" name="data" placeholder="Digite sua data de nascimento" required>
        </section>
        <section class="genero">
            <div>
                <label for="fgeneroM">Masculino</label>
                <input type="radio" id="fgeneroM" name="genero" value="M">
            </div>
            <div>
                <label for="fgeneroF">Feminino</label>
                <input type="radio" id="fgeneroF" name="genero" value="F">
            </div>
        </section>
        <section class="foto-section">
            <label>Foto de Perfil</label>
            <div id="camera-container" class="camera-container">
                <video id="video" autoplay></video>
                <canvas id="canvas"></canvas>
            </div>
            <div id="foto-preview" class="foto-preview">
                <img id="foto-capturada" alt="Foto capturada">
            </div>
            <div class="foto-buttons">
                <button type="button" id="btn-abrir-camera" class="btn-camera">
                    Abrir Câmera
                </button>
                <button type="button" id="btn-capturar" class="btn-camera" style="display: none;">
                    Tirar Foto
                </button>
                <button type="button" id="btn-nova-foto" class="btn-camera btn-secondary" style="display: none;">
                    Nova Foto
                </button>
            </div>
        </section>
        <section class="action">
            <input id="enviar" type="submit" value="Enviar">
            <input id="limpar" type="reset" value="Limpar">
        </section>
    </form>
</main>
</body>
</html>
